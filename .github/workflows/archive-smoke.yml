name: archive smoke

# Called by the generated release workflow (dist-workspace.toml `publish-jobs`) once every archive is
# built: unpack each one on its own architecture and run the offline smoke on the binary inside.
# The GitHub release is created only after this job passes.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

# The generated caller passes its own permissions and secrets; this job reads the artifacts and
# needs nothing else.
permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the built archives
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - run: scripts/archive-smoke.sh "artifacts/dejaview-${{ matrix.target }}.tar.xz"
        env:
          REQUIRE_CHECKSUM: "1"
