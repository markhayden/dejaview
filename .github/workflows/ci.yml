name: ci

on:
  push:
    branches: ["main", "m*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads the exact version pinned in rust-toolchain.toml and installs clippy and rustfmt.
      # GitHub's runner image ships rustup; the act image used by `just ci-local` does not, so
      # install it when missing.
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      # Cache is a GitHub-only optimisation; act cannot run this Node action under emulation.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !env.ACT }}
      - name: Install pinned helper tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-deny@0.20.2
      - name: Check scripts are executable and the brief is excluded
        run: |
          test -x scripts/check-crate-graph.sh
          test -x scripts/scan-secrets.sh
          git check-ignore -q docs/brief.md
          test -z "$(git ls-files docs/brief.md)"
      - run: just check
      - run: just deny-advisories

  python:
    name: python tool pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pack arrives in M1 task 1.14; until then every later step is skipped. (hashFiles is
      # only valid in step-level conditions, so the detection is a step.)
      - id: pack
        name: Detect the Python tool pack
        run: |
          if [ -f tools/python/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # The uv action's cache post-step needs node, which act's image lacks; under act, install uv
      # with its script instead.
      - if: steps.pack.outputs.present == 'true' && !env.ACT
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - if: steps.pack.outputs.present == 'true' && env.ACT
        name: Install uv (act)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" python install 3.12
      - if: steps.pack.outputs.present == 'true'
        run: uv sync --frozen
        working-directory: tools/python
      - if: steps.pack.outputs.present == 'true'
        run: uv run --frozen --offline --no-sync ruff check . && uv run --frozen --offline --no-sync ruff format --check .
        working-directory: tools/python
      - if: steps.pack.outputs.present == 'true'
        run: uv run --frozen --offline --no-sync pytest
        working-directory: tools/python
      # The set-building toolkit (scripts/sets): lint, tests, and the offline dry run checked by
      # the harness, which needs the Rust toolchain installed below; it runs after that step.
      - if: steps.pack.outputs.present == 'true'
        run: uv sync --frozen && uv run --frozen --offline --no-sync ruff check . && uv run --frozen --offline --no-sync ruff format --check . && uv run --frozen --offline --no-sync pytest -q
        working-directory: scripts/sets
      # The provisioning proof: build the bundle, fetch and build the Rust side with the network,
      # then install and launch the pack with no network namespace at all (`unshare -rn`).
      - if: steps.pack.outputs.present == 'true'
        name: Install Rust toolchain from rust-toolchain.toml
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - if: steps.pack.outputs.present == 'true' && !env.ACT
        uses: Swatinem/rust-cache@v2
        with:
          key: provisioning
      - if: steps.pack.outputs.present == 'true'
        name: The set-building toolkit's offline dry run, checked by the harness
        run: scripts/sets-dry-run.sh
      - if: steps.pack.outputs.present == 'true'
        name: The Rust client against the real pack (tasks 5.1 and 5.4a)
        run: cargo test -p dejaview-tools --test python_pack -- --ignored && cargo test -p dejaview --test python_pack_manifests -- --ignored
      - if: steps.pack.outputs.present == 'true'
        name: Build the provisioning bundle
        run: scripts/build-bundle.sh
      - if: steps.pack.outputs.present == 'true'
        name: Build the provisioning test with the network
        run: cargo test -p dejaview-tools --test provisioning --no-run
      # act's container cannot create namespaces; there the same install and call run without one.
      # GitHub's runners block unprivileged user namespaces (`unshare -r`), so the network namespace
      # is created with sudo and the test runs inside it as the runner user with its PATH and HOME.
      - if: steps.pack.outputs.present == 'true' && !env.ACT
        name: Install and launch the pack without a network
        run: |
          # sudo resets PATH, so the runner's values are passed as explicit arguments.
          sudo unshare -n -- sudo -u "$USER" env PATH="$PATH" HOME="$HOME" \
            UV_CACHE_DIR="$UV_CACHE_DIR" UV_PYTHON="$UV_PYTHON" \
            UV_OFFLINE=1 UV_PYTHON_DOWNLOADS=never CARGO_TERM_COLOR=always \
            cargo test --offline -p dejaview-tools --test provisioning -- --ignored
      - if: steps.pack.outputs.present == 'true' && env.ACT
        name: Install and launch the pack (no namespace under act)
        run: env UV_OFFLINE=1 UV_PYTHON_DOWNLOADS=never cargo test --offline -p dejaview-tools --test provisioning -- --ignored
