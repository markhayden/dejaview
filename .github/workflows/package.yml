name: package

# Proves the crates publish and install as crates.io would serve them: a workspace publish dry run
# (package, verify, no upload) and an install of `dejaview` from the packaged .crate files in a
# scratch directory outside the checkout, followed by the offline smoke.
on:
  push:
    branches: ["main", "m*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  registry:
    name: publish dry run and install from the packaged crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: ${{ !env.ACT }}
      - run: scripts/check-packaging.sh
      - run: scripts/publish.sh --dry-run
      - name: Install from the packaged crates outside the checkout and smoke
        run: REGISTRY_STAGE_DIR="$RUNNER_TEMP/registry-stage" scripts/registry-install-test.sh
