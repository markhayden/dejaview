# The fake region finder used by tests: a change_region tool with one image argument.
[tool]
name = "fake_regions"
version = "0.0.1"
purpose = "Test double: returns scripted change regions for an image."
when_to_use = "Only in tests."
when_not_to_use = "Anywhere real."
output_guidance = "Each region is a pointer, not a verdict."
cost = { tier = "cheap", seconds = 0.0 }
image_args = ["image"]
evidence_kind = "change_region"
returns = { max_images = 1, max_long_edge = 1024, max_image_bytes = 2_000_000, max_summary_bytes = 2048, max_regions = 30, max_region_label_bytes = 120, max_measurements = 8, max_transforms = 0, max_envelope_bytes = 65_536 }
frames_out = ["crop"]

[tool.model_schema]
type = "object"
additionalProperties = false
required = ["image"]
[tool.model_schema.properties.image]
type = "string"
description = "The image id to find changes in."

[tool.input_schema]
type = "object"
additionalProperties = false
required = ["image", "_dejaview"]
[tool.input_schema.properties.image]
type = "string"
[tool.input_schema.properties._dejaview]
type = "object"

[tool.output_schema]
type = "object"
