# The fake server's state probe: reports calls since start or reset, its pid, and which test
# variables reached its environment.
[tool]
name = "probe_state"
version = "0.0.1"
purpose = "Test double: reports the fake server's state."
when_to_use = "Only in tests."
when_not_to_use = "Anywhere real."
output_guidance = "Numbers about the server, not about any image."
cost = { tier = "cheap", seconds = 0.0 }
returns = { max_images = 0, max_long_edge = 0, max_image_bytes = 0, max_summary_bytes = 2048, max_regions = 0, max_region_label_bytes = 0, max_measurements = 8, max_transforms = 0, max_envelope_bytes = 65_536 }

[tool.model_schema]
type = "object"
additionalProperties = false
required = []

[tool.input_schema]
type = "object"
additionalProperties = false
required = ["_dejaview"]
[tool.input_schema.properties._dejaview]
type = "object"

[tool.output_schema]
type = "object"
[tool.output_schema.properties.measurements]
type = "array"
[tool.output_schema.properties.measurements.items]
type = "object"
[tool.output_schema.properties.measurements.items.properties.name]
type = "string"
enum = ["calls_since_reset", "pid", "max_in_flight"]
