# The model catalog (SPEC "Model catalog", ADR 0008). Every value was read from the provider's
# documentation on the `verified` date; `sources` are the pages read. Settings a model does not
# support are rejected at resolve time (`squint-providers::catalog`). The catalog is part of the
# cache key. Preview models are excluded. Fields the documentation does not state are listed under
# `unverified` and recorded in docs/provider-data.md; they are re-verified when fixtures are
# recorded (tasks 2.5b, 2.6b, 2.7b).
catalog_version = 1

# ---- endpoint profiles shipped at first release (API-key schemes only) -------------------------
[profiles.anthropic]
account = "anthropic"
adapter = "anthropic-messages"
base_url = "https://api.anthropic.com"
path = "/v1/messages"
auth = { scheme = "api-key-header", header = "x-api-key", env = "ANTHROPIC_API_KEY" }
headers = { anthropic-version = "2023-06-01" }

[profiles.google-ai-studio]
account = "google"
adapter = "gemini-generate-content"
base_url = "https://generativelanguage.googleapis.com"
path = "/v1beta/models/{model}:generateContent"
auth = { scheme = "api-key-header", header = "x-goog-api-key", env = "GEMINI_API_KEY" }
headers = {}

[profiles.openai]
account = "openai"
adapter = "openai-responses"
base_url = "https://api.openai.com"
path = "/v1/responses"
auth = { scheme = "bearer", header = "Authorization", env = "OPENAI_API_KEY" }
headers = {}

