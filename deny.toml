# cargo-deny configuration. Licences a dependency may carry; anything else fails `just check`.
[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "MPL-2.0",   # file-level copyleft; acceptable for a binary that does not modify such files
  "CDLA-Permissive-2.0",   # Mozilla's root-certificate data, bundled by rustls-platform-verifier
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path-only dev-dependency has no version and counts as a wildcard; `cargo publish` drops it,
# which is how the core crate's dev-dependency on the testkit avoids a publish cycle.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
