# Reference consistency: a subject from one or more reference images appears faithfully in a new scene.
#
# Run:  squint check --config examples/reference-consistency.toml --use-case reference-consistency --candidate scene.png --ref subject=portrait.png
# Credentials come from the environment only (ANTHROPIC_API_KEY, GEMINI_API_KEY or OPENAI_API_KEY);
# the account line expands the attestation that `[privacy] cloud_calls` binds to the profile.
# To point this config at another direct profile without editing it:
#   --set provider.profile=google-ai-studio --set provider.model=gemini-3.8-flash --set privacy.account=google:${SQUINT_GOOGLE_ACCOUNT}
#   --set provider.profile=openai --set provider.model=gpt-6.1-terra --set privacy.account=openai:${SQUINT_OPENAI_ACCOUNT}
# Model controls are per model (`squint catalog show <model>`), for example
#   controls = { effort = "low" }                  # claude-*
#   controls = { thinking_level = "low" }          # gemini-*
#   controls = { reasoning_effort = "low" }        # gpt-*

[provider]
profile = "anthropic"
model = "claude-haiku-5-5"

[rules]
base = "reference-consistency"

[budget]
# The cap is checked before the first call against the worst-case envelope (every tool turn, the
# final turn and the repair at the full output allowance, plus a reserve for `retries` failed
# attempts). A check on the cheapest models usually costs a few cents; the envelope is a bound.
spend_cap_usd = 2.00

[privacy]
cloud_calls = true
account = "anthropic:${SQUINT_ANTHROPIC_ACCOUNT}"

[output]
dir = "./squint-out"
