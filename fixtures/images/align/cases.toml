# Failure fixtures for the alignment estimator (PLAN task 4.0, ADR 0014): source/candidate pairs
# under this directory, generated by the synthetic scenes in `squint_testkit::images`
# (regenerate with `UPDATE_FIXTURES=1 cargo test -p squint-tools --test align
# the_failure_fixtures`), each with the outcome `align_flat` must give.

[[case]]
name = "unrelated"
source = "scene.png"
candidate = "unrelated.png"
status = "not_registered"
why = "two different scenes: registration converges somewhere but the registered pair does not agree"

[[case]]
name = "low-texture"
source = "gradient-a.png"
candidate = "gradient-b.png"
status = "low_texture"
why = "a linear gradient determines no translation along its level lines"

[[case]]
name = "mirror"
source = "square.png"
candidate = "mirror.png"
status = "not_registered"
why = "a reflection is not reachable from the identity and is not the same viewpoint"

[[case]]
name = "quarter-turn"
source = "square.png"
candidate = "quarter-turn.png"
status = "not_registered"
why = "a 90° turn is outside the rotations the coarse search covers; align assumes the same viewpoint"

[[case]]
name = "far-shift"
source = "scene.png"
candidate = "far-shift.png"
status = "not_registered"
why = "a shift of 84% of the width leaves too little overlap to vouch for"

[[case]]
name = "registered"
source = "scene.png"
candidate = "registered.png"
status = "registered"
why = "the control: a restyled candidate scaled 2%, turned 2° and shifted registers"
