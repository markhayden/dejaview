# A small paired result table with unequal family sizes (SPEC "Gates"). Hand-checkable facts:
# eight expected-fail items; C detects one (f2-a), X detects seven (every expected fail but f5-a),
# so the point estimand is (7 - 1) / 8 = 0.75; the differing families are f1, f2, f3, f4 and f6
# (f5 is missed by both); f7 has no expected fail and never enters the resampling; X adds one
# false reject (f5-b) and no errors; C leaves f4-b unsure. The golden section is reproduced from
# the seed exactly (regenerate with UPDATE_FIXTURES=1 when the contract itself changes).
seed = 20261026
resamples = 1000
hypotheses = 1
cost_c_usd = 1.0
cost_x_usd = 1.5

[policy]
on_unsure = "review"
on_error = "review"

[[items]]
family = "f1"
id = "f1-a"
expected = "fail"
c = "pass"
x = "fail"

[[items]]
family = "f1"
id = "f1-b"
expected = "pass"
c = "pass"
x = "pass"

[[items]]
